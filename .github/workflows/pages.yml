name: Deploy Web to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Use relative URLs for GitHub Pages
        run: sed -i 's|<base href="/"|<base href="./"|' FEFWRNGSolver.Web/wwwroot/index.html

      - name: Publish Blazor WebAssembly
        run: dotnet publish FEFWRNGSolver.Web/FEFWRNGSolver.Web.csproj -c Release -o publish

      - uses: actions/upload-pages-artifact@v4
        with:
          path: publish/wwwroot

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
